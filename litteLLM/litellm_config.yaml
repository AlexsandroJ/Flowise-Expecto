model_list:
  # ==========================================
  # GRUPO 1: groq/openai/gpt-oss-20b (3 chaves)
  # ==========================================
  - model_name: groq/openai/gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_AJS6
      rpm: 30
      tpm: 8000

  - model_name: groq/openai/gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_UFPE
      rpm: 30
      tpm: 8000

  - model_name: groq/openai/gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_BBOY
      rpm: 30
      tpm: 8000

  # ==========================================
  # GRUPO 2: groq/openai/gpt-oss-120b (3 chaves)
  # ==========================================
  - model_name: groq/openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_AJS6
      rpm: 30
      tpm: 8000

  - model_name: groq/openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_UFPE
      rpm: 30
      tpm: 8000

  - model_name: groq/openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_BBOY
      rpm: 30
      tpm: 8000

  # ==========================================
  # GRUPO 3: groq/qwen/qwen3.8-27b (3 chaves)
  # ==========================================
  - model_name: groq/qwen/qwen3.8-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY_AJS6
      rpm: 30
      tpm: 8000

  - model_name: groq/qwen/qwen3.8-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY_UFPE
      rpm: 30
      tpm: 8000

  - model_name: groq/qwen/qwen3.8-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY_BBOY
      rpm: 30
      tpm: 8000

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3 # Tenta as 3 chaves dentro do mesmo grupo antes de pular de modelo
  cooldown_time: 300
  fallbacks:
    - groq/openai/gpt-oss-20b: ["groq/openai/gpt-oss-120b", "groq/qwen/qwen3.8-27b"]
